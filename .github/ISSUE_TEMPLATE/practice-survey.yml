name: "🪷 Practice survey"
description: Share your meditation experience (dos and avoids) with the circle
title: "Survey: "
labels: ["survey"]
body:
  - type: markdown
    attributes:
      value: |
        This survey is **public** and optional in every part. Please don't share health details you'd want kept private.
        If meditation is making you feel unwell, please talk to a teacher or health professional. In crisis: Lifeline 13 11 14 (Australia), 988 (US), or your local line.
  - type: dropdown
    id: tradition
    attributes:
      label: Main tradition or teacher you practise with
      options:
        - Yoga (Patanjali / classical)
        - Theravada / Vipassana
        - Tibetan / Himalayan Vajrayana (Nyingma, Kagyu, Drukpa, other)
        - Zen / Chan
        - Secular mindfulness
        - Several / mixed
        - None yet
        - Other
  - type: dropdown
    id: minutes
    attributes:
      label: Average minutes of meditation per day
      options: ["0–5", "5–20", "20–45", "45–90", "90+"]
  - type: input
    id: method
    attributes:
      label: Main method or anchor
      placeholder: breath, mantra, mettā, open awareness…
  - type: dropdown
    id: teacher
    attributes:
      label: Do you have a teacher or community you can ask questions?
      options: ["Yes", "Sometimes", "No"]
  - type: dropdown
    id: hindrance
    attributes:
      label: Which hindrance visits you most?
      options: ["Sensual desire", "Ill will", "Dullness / sleepiness", "Restlessness / worry", "Doubt"]
  - type: textarea
    id: do
    attributes:
      label: One "do" that has helped your practice most
  - type: textarea
    id: avoid
    attributes:
      label: One "avoid" you learned the hard way
  - type: textarea
    id: ai
    attributes:
      label: What should an AI **never** do when people ask about meditation?
  - type: input
    id: intention
    attributes:
      label: One line of intention for the circle (optional)
